# TCPServer network configuration.
# Place a copy of this file next to the JAR (working directory) to override the bundled one,
# or point to another file with: java -Dchat.config=/path/to/server.properties -jar TCPServer.jar

# Interface to listen on. 0.0.0.0 = all interfaces, 127.0.0.1 = this machine only.
server.address=0.0.0.0

# TCP port clients connect to.
server.port=3000
