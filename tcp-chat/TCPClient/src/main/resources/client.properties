# TCPClient defaults, used when no command-line arguments are given.
# Command line (java TCPClient <ServerIPAddress> <PortNumber>) always wins.
# Place a copy of this file next to the JAR (working directory) to override the bundled one,
# or point to another file with: java -Dchat.config=/path/to/client.properties -jar TCPClient.jar

# IP address or host name of the chat server.
server.ip=localhost

# TCP port of the chat server.
server.port=3000
